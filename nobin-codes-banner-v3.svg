<svg width="2000" height="520" viewBox="0 0 2000 520" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>GitHub profile banner for nobin-codes</title>
<defs>
<radialGradient id="bgGlow" cx="30%" cy="45%" r="75%">
<stop offset="0%" stop-color="#0e2536"/>
<stop offset="45%" stop-color="#081a28"/>
<stop offset="100%" stop-color="#020608"/>
</radialGradient>
<linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#9fb4bf"/>
<stop offset="50%" stop-color="#3d4f58"/>
<stop offset="100%" stop-color="#8fa3ac"/>
</linearGradient>
<linearGradient id="streak" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#39e6ff" stop-opacity="0"/>
<stop offset="45%" stop-color="#39e6ff" stop-opacity="0.9"/>
<stop offset="100%" stop-color="#39e6ff" stop-opacity="0"/>
</linearGradient>
<filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="7" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
<feGaussianBlur stdDeviation="16"/>
</filter>
</defs>

<rect width="2000" height="520" fill="#000"/>
<rect width="2000" height="520" fill="url(#bgGlow)"/>

<!-- faint particle network, left region -->
<g stroke="#3fd9ff" stroke-width="1" opacity="0.35" fill="none">
<line x1="70" y1="95" x2="230" y2="60"/>
<line x1="230" y1="60" x2="330" y2="150"/>
<line x1="70" y1="95" x2="120" y2="220"/>
<line x1="120" y1="220" x2="230" y2="60"/>
<line x1="120" y1="220" x2="260" y2="270"/>
<line x1="260" y1="270" x2="330" y2="150"/>
<line x1="260" y1="270" x2="200" y2="400"/>
<line x1="200" y1="400" x2="330" y2="440"/>
<line x1="330" y1="440" x2="470" y2="390"/>
<line x1="330" y1="150" x2="470" y2="120"/>
<line x1="470" y1="120" x2="600" y2="90"/>
<line x1="330" y1="150" x2="470" y2="390"/>
<line x1="70" y1="95" x2="40" y2="260"/>
<line x1="40" y1="260" x2="120" y2="220"/>
</g>
<g fill="#7fe9ff">
<circle cx="70" cy="95" r="4"/>
<circle cx="230" cy="60" r="3.5"/>
<circle cx="330" cy="150" r="4.5"/>
<circle cx="120" cy="220" r="4"/>
<circle cx="260" cy="270" r="3.5"/>
<circle cx="200" cy="400" r="4"/>
<circle cx="330" cy="440" r="3.5"/>
<circle cx="470" cy="390" r="4"/>
<circle cx="470" cy="120" r="3.5"/>
<circle cx="600" cy="90" r="3.5"/>
<circle cx="40" cy="260" r="3"/>
</g>

<!-- faint code snippet, background texture -->
<g font-family="Menlo, Consolas, monospace" font-size="17" fill="#4a6a78" opacity="0.55">
<text x="640" y="80">...</text>
<text x="640" y="115">function welcome() {</text>
<text x="670" y="145">...</text>
<text x="640" y="175">}</text>
<text x="640" y="205">&lt;script&gt;console.log('Hello World!');&lt;/script&gt;</text>
</g>

<!-- title block -->
<text x="270" y="285" font-family="Menlo, Consolas, monospace" font-size="92" font-weight="700" fill="#dff6ff" filter="url(#bigGlow)" opacity="0.55">nobin-codes</text>
<text x="270" y="285" font-family="Menlo, Consolas, monospace" font-size="92" font-weight="700" fill="#f2fbff">nobin-codes</text>

<text x="273" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#e7f3f7">Creative Developer&#160;|&#160;Building the Future</text>
<text x="273" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#b9ccd3">Full Stack Web Development&#160;|&#160;UI/UX Design&#160;|&#160;Systems</text>

<!-- badge icon: code + rocket in glowing circle -->
<g transform="translate(1050,240)">
<circle r="82" fill="#0c1e2a" stroke="#4fd8ff" stroke-width="2" opacity="0.9" filter="url(#softGlow)"/>
<circle r="82" fill="none" stroke="#bdeeff" stroke-width="1.5"/>
<text x="-8" y="16" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="46" font-weight="700" fill="#f2fbff">&lt;/&gt;</text>
</g>
<g transform="translate(1170,255) rotate(-25)">
<path d="M0,-30 C14,-14 14,14 0,30 C-14,14 -14,-14 0,-30 Z" fill="#e8f7fb" opacity="0.9"/>
<circle cx="0" cy="-4" r="7" fill="#0c1e2a"/>
<path d="M-10,22 L-18,42 L-2,30 Z" fill="#3fd9ff" opacity="0.85"/>
<path d="M10,22 L18,42 L2,30 Z" fill="#3fd9ff" opacity="0.85"/>
</g>

<!-- diagonal streak flowing right -->
<path d="M1250,470 C1450,430 1550,300 1650,230 C1750,160 1850,120 1980,90" stroke="url(#streak)" stroke-width="3" fill="none" filter="url(#softGlow)"/>
<path d="M1250,470 C1450,430 1550,300 1650,230 C1750,160 1850,120 1980,90" stroke="#39e6ff" stroke-width="1" fill="none" opacity="0.5"/>

<!-- faint code lines riding the streak -->
<g font-family="Menlo, Consolas, monospace" font-size="14" fill="#5fb8d4" opacity="0.55">
<text x="1300" y="440" transform="rotate(-14 1300 440)">import react from 'react';</text>
<text x="1420" y="380" transform="rotate(-16 1420 380)">function welcome() {</text>
<text x="1540" y="320" transform="rotate(-18 1540 320)">console.log('Hello World!');</text>
<text x="1660" y="255" transform="rotate(-16 1660 255)">&lt;/script&gt;</text>
</g>

<!-- tech labels along the streak -->
<g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
<g transform="translate(1560,215)">
<circle r="16" fill="none" stroke="#7fe9ff" stroke-width="1.5"/>
<ellipse rx="16" ry="6" fill="none" stroke="#7fe9ff" stroke-width="1"/>
<ellipse rx="16" ry="6" fill="none" stroke="#7fe9ff" stroke-width="1" transform="rotate(60)"/>
<ellipse rx="16" ry="6" fill="none" stroke="#7fe9ff" stroke-width="1" transform="rotate(120)"/>
<circle r="3.5" fill="#7fe9ff"/>
</g>
<text x="1590" y="222" fill="#dff6ff">React</text>

<g transform="translate(1780,150)">
<polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="none" stroke="#7fe9ff" stroke-width="1.5"/>
</g>
<text x="1805" y="157" fill="#dff6ff">Node</text>

<g transform="translate(1900,105)">
<rect x="-12" y="-16" width="24" height="32" rx="6" fill="none" stroke="#7fe9ff" stroke-width="1.5"/>
</g>
<text x="1922" y="112" fill="#dff6ff">Figma</text>
</g>

<!-- outer frame -->
<rect x="30" y="30" width="1940" height="460" rx="6" fill="none" stroke="url(#frame)" stroke-width="4"/>

<!-- corner sparkle accents -->
<g fill="#dff6ff" opacity="0.85">
<path d="M20,20 L26,8 L32,20 L26,32 Z"/>
<path d="M1980,500 L1986,488 L1992,500 L1986,512 Z"/>
</g>
</svg>
